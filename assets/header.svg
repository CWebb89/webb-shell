<svg viewBox="0 0 700 132" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="webb-shell">
  <title>webb-shell</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="text-reveal">
      <rect x="0" y="0" width="0" height="132">
        <animate attributeName="width" from="0" to="700" dur="2.3s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="card">
      <rect x="0" y="0" width="700" height="132" rx="14"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="699" height="131" rx="14" fill="#1a1b26" stroke="#414868"/>

  <g clip-path="url(#card)">
    <ellipse cx="350" cy="38" rx="300" ry="42" fill="url(#halo)" opacity="0">
      <animate attributeName="opacity" from="0" to="0.14" dur="1s" begin="0.7s" fill="freeze"/>
    </ellipse>

    <text x="350" y="48" font-family="'Courier New', 'Consolas', monospace" font-size="44"
          font-weight="900" letter-spacing="5" text-anchor="middle" fill="url(#accent)"
          clip-path="url(#text-reveal)">webb-shell</text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 -24" to="0 0"
                        dur="0.85s" begin="2.5s" fill="freeze"/>

      <rect x="100" y="62" width="500" height="18" rx="5" fill="#24283b" stroke="#414868"/>

      <rect x="108" y="67" width="9" height="8" rx="2" fill="#7aa2f7"/>
      <rect x="121" y="67" width="9" height="8" rx="2" fill="#414868"/>
      <rect x="134" y="67" width="9" height="8" rx="2" fill="#414868"/>
      <rect x="147" y="67" width="9" height="8" rx="2" fill="#414868"/>

      <rect x="300" y="67" width="44" height="8" rx="2" fill="#bb9af7" opacity="0.8"/>
      <rect x="350" y="67" width="18" height="8" rx="2" fill="#565f89"/>
      <rect x="378" y="67" width="30" height="8" rx="2" fill="#c0caf5" opacity="0.75"/>

      <rect x="470" y="67" width="8" height="8" rx="2" fill="#565f89"/>
      <rect x="484" y="67" width="8" height="8" rx="2" fill="#565f89"/>
      <rect x="498" y="67" width="8" height="8" rx="2" fill="#7dcfff" opacity="0.85"/>
      <rect x="512" y="67" width="14" height="8" rx="2" fill="#9ece6a" opacity="0.85"/>
      <rect x="532" y="67" width="28" height="8" rx="2" fill="#565f89"/>
      <rect x="566" y="67" width="10" height="8" rx="2" fill="#565f89"/>
    </g>

    <line x1="104" y1="81.5" x2="596" y2="81.5" stroke="#7dcfff" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="492" stroke-dashoffset="492" opacity="0">
      <animate attributeName="stroke-dashoffset" from="492" to="0" dur="2.3s" begin="3.1s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="0.4" dur="0.3s" begin="3.1s" fill="freeze"/>
    </line>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 -12" to="0 0"
                        dur="0.5s" begin="3.6s" fill="freeze"/>

      <rect x="520" y="84" width="76" height="28" rx="5" fill="#1f2030" stroke="#414868"/>
      <rect x="529" y="91" width="58" height="4" rx="2" fill="#7aa2f7" opacity="0.85"/>
      <rect x="529" y="99" width="40" height="4" rx="2" fill="#565f89"/>
      <rect x="575" y="99" width="12" height="4" rx="2" fill="#414868"/>

      <rect x="520" y="84" width="76" height="28" rx="5" fill="none" stroke="#7dcfff"
            stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="1.6s" begin="4.2s" repeatCount="2"/>
      </rect>
    </g>

    <text x="350" y="124" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"
          fill="#a9b1d6" text-anchor="middle" letter-spacing="2.4" opacity="0">
      QUICKSHELL DESKTOP SHELL FOR HYPRLAND
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="4.1s" fill="freeze"/>
    </text>
  </g>
</svg>
